name: Design-system check

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  check-colors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-colors.js --self-test
      - run: node tools/check-colors.js
