name: Translations check

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  check-translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/translations.js --self-test
      - run: node scripts/translations.js check
